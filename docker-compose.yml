name: iiqstack

services:
  counter:
    image: drosenbauer/docker-counter
    platform: linux/amd64

  ssh:
    image: drosenbauer/docker-ssh-host
    platform: linux/amd64
    labels:
      - traefik.enable=false

  ldap:
    image: vegardit/openldap:${OPENLDAP_VERSION:-2.6.x}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:1389:389"
    environment:
      - LDAP_INIT_ORG_DN=dc=sailpoint,dc=demo
      - LDAP_INIT_ORG_NAME=Sailpoint Demo
      - LDAP_INIT_ROOT_USER_DN=cn=admin,dc=sailpoint,dc=demo
      - LDAP_INIT_ROOT_USER_PW=spadmin
    volumes:
      # Replace the image's sample tree, users and password policy with a bare base entry
      - ./ldap/init_org_tree.ldif:/opt/ldifs/init_org_tree.ldif:ro
      - ./ldap/init_org_ppolicy.ldif:/opt/ldifs/init_org_ppolicy.ldif:ro
      - ./ldap/init_org_entries.ldif:/opt/ldifs/init_org_entries.ldif:ro
    healthcheck:
      # Port 389 only answers once first-time initialization has finished
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://localhost:389 -b '' -s base namingContexts | grep -q 'dc=sailpoint,dc=demo'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    labels:
        - traefik.enable=false

  phpldapadmin:
    image: phpldapadmin/phpldapadmin:${PHPLDAPADMIN_VERSION:-2.3.12}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PHPLDAPADMIN_PORT:-8081}:8080"
    environment:
      - LDAP_HOST=ldap
      - LDAP_NAME=Sailpoint Demo
      - LDAP_BASE_DN=dc=sailpoint,dc=demo
      - LDAP_USERNAME=cn=admin,dc=sailpoint,dc=demo
      - LDAP_PASSWORD=spadmin
      # Log in with the full DN, e.g. cn=admin,dc=sailpoint,dc=demo
      - LDAP_LOGIN_ATTR=DN
      - LDAP_LOGIN_OBJECTCLASS=simpleSecurityObject,organizationalRole,inetOrgPerson,posixAccount
    depends_on:
      - ldap

  activemq:
    image: apache/artemis:${ARTEMIS_VERSION:-2.57.0}-alpine
    labels:
        - "traefik.enable=true"
        - "traefik.http.routers.activemq.entrypoints=web"
        - "traefik.http.routers.activemq.service=activemq"
        - "traefik.http.routers.activemq.rule=PathPrefix(`/activemq`)"
        - "traefik.http.services.activemq.loadbalancer.server.port=8161"
        - "traefik.http.services.activemq.loadbalancer.server.scheme=http"
        - "traefik.http.services.activemq.loadbalancer.sticky.cookie=true"    

  db:
    image: "mcr.microsoft.com/mssql/server:${MSSQL_VERSION:-2022-latest}"
    platform: linux/amd64
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=id3ntityIQ!-TQ8BaiOxKAL4v-4lCIxVx
      - MSSQL_PID=Developer
    labels:
        - traefik.enable=false

  db_mysql:
    image: "mysql:${MYSQL_VERSION:-8.4}"
    environment:
      - MYSQL_USER=identityiq
      - MYSQL_PASSWORD=identityiq
      - MYSQL_DATABASE=identityiq
      - MYSQL_ROOT_PASSWORD=password
    labels: 
        - traefik.enable=false

  mail:
    image: axllent/mailpit
    ports:
      - 1025:1025
      - "${MAILHOG_HTTP_PORT:-8025}:8025"
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    labels:
      - traefik.enable=false

  loadbalancer:
    image: traefik:3.6.25
    command:
      - "--providers.docker=true" 
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--log.level=DEBUG" 
      - "--accesslog=true"
      - "--accesslog.addinternals"
      - "--providers.docker.exposedbydefault=false"
      - "--entryPoints.web.address=:80"
    ports:
      - "${LISTEN_PORT:-8080}:80"      # The HTTP port
      - "${BIND_ADDRESS:-127.0.0.1}:28080:8080"  # Unauthenticated dashboard
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro" # So that Traefik can listen to the Docker events
    labels:
        - "traefik.enable=false"

  iiq:
    build: 
      context: ./iiq-build/
      args:
        - TOMCAT_VERSION=${TOMCAT_VERSION:-9-jdk17-temurin-jammy}
        - JDK_VERSION=${JDK_VERSION:-17-jdk-jammy}
    image: git.identityworksllc.com:5005/idw/idw-sailpoint/sailpoint-docker:${TAG:-latest}
    environment:
      - DATABASE_TYPE=${IIQ_DB_TYPE:-mssql}
      - MSSQL_HOST=db
      - MSSQL_SA_USER=sa
      - MSSQL_USER=identityiq
      - MSSQL_PASS=id3ntityIQ!-TQ8BaiOxKAL4v-4lCIxVx
      - MSSQL_SA_PASSWORD=id3ntityIQ!-TQ8BaiOxKAL4v-4lCIxVx
      - "MYSQL_HOST=db_mysql"
      - MYSQL_USER=identityiq
      - MYSQL_PASSWORD=identityiq
      - MYSQL_DATABASE=identityiq
      - MYSQL_ROOT_PASSWORD=password
      - CATALINA_OPTS=-Xmx2048M
    deploy:
      mode: replicated
      replicas: ${IIQ_REPLICAS:-2}
    depends_on:
      counter:
          condition: service_started
      db:
          condition: service_started
      db_mysql:
          condition: service_started
      mail:
          condition: service_started
      ldap:
          condition: service_started
      iiq-init:
          condition: service_completed_successfully
      activemq:
          condition: service_started
    labels:
        - "traefik.enable=true"
        - "traefik.http.routers.iiq.entrypoints=web"
        - "traefik.http.routers.iiq.service=iiq"
        - "traefik.http.routers.iiq.rule=PathPrefix(`/identityiq`)"
        - "traefik.http.services.iiq.loadbalancer.server.port=8080"
        - "traefik.http.services.iiq.loadbalancer.server.scheme=http"
        - "traefik.http.services.iiq.loadbalancer.sticky.cookie=true"

  iiq-init:
    image: git.identityworksllc.com:5005/idw/idw-sailpoint/sailpoint-docker:${TAG:-latest}
    environment:
      - DATABASE_TYPE=${IIQ_DB_TYPE:-mssql}
      - MSSQL_HOST=db
      - MSSQL_SA_USER=sa
      - MSSQL_USER=identityiq
      - MSSQL_PASS=id3ntityIQ!-TQ8BaiOxKAL4v-4lCIxVx
      - MSSQL_SA_PASSWORD=id3ntityIQ!-TQ8BaiOxKAL4v-4lCIxVx
      - "MYSQL_HOST=db_mysql"
      - MYSQL_USER=identityiq
      - MYSQL_PASSWORD=identityiq
      - MYSQL_DATABASE=identityiq
      - MYSQL_ROOT_PASSWORD=password
      - INIT=y
    depends_on:
      db:
          condition: service_started
      db_mysql:
          condition: service_started
      mail:
          condition: service_started
      ldap:
          condition: service_healthy
    deploy:
      restart_policy:
        condition: none
